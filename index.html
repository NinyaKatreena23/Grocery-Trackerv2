<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f7f4ef">
  <title>Grocery Budget Tracker</title>
  <style>
    :root {
      --bg: #f7f4ef;
      --card: #ffffff;
      --ink: #30332f;
      --muted: #85877f;
      --sage: #738b78;
      --sage-dark: #536c59;
      --sage-light: #e8efe8;
      --peach: #f4e5dc;
      --line: #ecebe5;
      --danger: #c66d68;
      --shadow: 0 8px 28px rgba(56, 62, 52, .07);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--ink); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    body { padding-bottom: max(22px, env(safe-area-inset-bottom)); }
    button, input { font: inherit; }
    .sticky {
      position: sticky; top: 0; z-index: 10;
      background: rgba(247,244,239,.97);
      padding: max(14px, env(safe-area-inset-top)) 16px 12px;
      border-bottom: 1px solid rgba(220,220,210,.75);
      backdrop-filter: blur(14px);
    }
    .top-inner { max-width: 620px; margin: 0 auto; }
    .app-title { display:flex; align-items:center; justify-content:space-between; margin-bottom: 12px; }
    .app-title h1 { font-size: 19px; margin: 0; letter-spacing: -.4px; }
    .app-title span { font-size: 12px; color: var(--muted); }
    .budget-row { display:flex; align-items:center; gap:10px; margin-bottom: 10px; }
    .budget-label { color:var(--muted); font-size:12px; font-weight:650; white-space:nowrap; }
    .budget-input-wrap { flex:1; display:flex; align-items:center; background:#fff; border:1px solid var(--line); border-radius:12px; padding:0 12px; height:40px; }
    .currency { color:var(--muted); font-size:14px; margin-right:6px; }
    #budget { width:100%; border:0; outline:0; background:transparent; color:var(--ink); font-size:16px; font-weight:650; min-width:0; }
    .summary { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
    .sum-card { background:var(--card); border:1px solid var(--line); border-radius:15px; padding:12px 14px; box-shadow:0 3px 12px rgba(56,62,52,.035); min-width:0; }
    .sum-card.total { background:var(--sage-light); border-color:#dce7dc; }
    .sum-label { font-size:11px; color:var(--muted); font-weight:700; letter-spacing:.45px; text-transform:uppercase; margin-bottom:5px; }
    .sum-value { font-size:clamp(20px, 5vw, 25px); font-weight:800; letter-spacing:-.7px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .sum-card.total .sum-value { color:var(--sage-dark); }
    .sum-card.remaining .sum-value { color:var(--sage-dark); }
    .sum-card.remaining.over .sum-value { color:var(--danger); }
    .content { max-width:620px; margin:0 auto; padding:16px; }
    .panel { background:var(--card); border:1px solid var(--line); border-radius:20px; padding:16px; box-shadow:var(--shadow); margin-bottom:16px; }
    .section-heading { display:flex; justify-content:space-between; align-items:center; margin:0 0 12px; }
    .section-heading h2 { margin:0; font-size:15px; }
    .section-heading small { color:var(--muted); font-size:11px; }
    .amount-wrap { display:flex; align-items:center; border:1.5px solid #e5e7df; background:#fbfcf9; border-radius:14px; padding:0 14px; height:54px; margin-bottom:13px; }
    .amount-wrap:focus-within { border-color:var(--sage); box-shadow:0 0 0 3px rgba(115,139,120,.12); }
    .amount-wrap .currency { font-size:18px; font-weight:700; color:var(--sage-dark); }
    #amount { border:0; outline:0; background:transparent; width:100%; min-width:0; font-size:23px; font-weight:750; color:var(--ink); }
    #amount::placeholder { color:#c3c5bd; font-weight:500; }
    .category-label { font-size:12px; color:var(--muted); font-weight:650; margin:0 0 9px; }
    .categories { display:grid; grid-template-columns:repeat(4,1fr); gap:7px; }
    .category {
      border:1px solid var(--line); background:#fff; color:#62665f; border-radius:12px;
      min-height:48px; padding:7px 3px; font-size:11px; font-weight:700; cursor:pointer;
      transition:.15s ease;
    }
    .category .emoji { display:block; font-size:17px; margin-bottom:3px; }
    .category.selected { background:var(--sage-light); border:1.5px solid var(--sage); color:var(--sage-dark); }
    .add-btn { width:100%; border:0; border-radius:13px; background:var(--sage); color:#fff; font-weight:750; height:48px; margin-top:14px; cursor:pointer; box-shadow:0 5px 12px rgba(83,108,89,.18); }
    .add-btn:active { transform:scale(.99); }
    .list-panel { padding:16px 14px 8px; }
    .list-heading { padding:0 2px; }
    .count { background:#f2f1eb; color:#777b72; padding:4px 8px; border-radius:20px; font-size:11px; font-weight:700; }
    #items { list-style:none; padding:0; margin:0; }
    .item { display:flex; align-items:center; gap:10px; padding:13px 2px; border-top:1px solid #f0f0eb; }
    .item-icon { width:38px; height:38px; flex:0 0 38px; border-radius:12px; background:#f5f3ed; display:grid; place-items:center; font-size:18px; }
    .item-info { flex:1; min-width:0; }
    .item-category { font-size:13px; font-weight:700; }
    .item-number { color:var(--muted); font-size:11px; margin-top:3px; }
    .item-price { font-size:14px; font-weight:750; white-space:nowrap; }
    .delete-btn { border:0; background:#fbefed; color:var(--danger); width:32px; height:32px; border-radius:10px; font-size:18px; cursor:pointer; margin-left:2px; }
    .empty { text-align:center; padding:27px 10px 30px; color:var(--muted); font-size:13px; line-height:1.5; }
    .empty .basket { font-size:29px; margin-bottom:7px; }
    .footer-actions { display:flex; justify-content:space-between; align-items:center; padding:13px 2px 7px; }
    .hint { color:var(--muted); font-size:11px; }
    .clear-btn { border:0; background:transparent; color:var(--danger); font-size:12px; font-weight:700; padding:8px 4px; cursor:pointer; }
    .notice { font-size:12px; color:var(--danger); font-weight:650; min-height:17px; margin-top:8px; }
    @media (max-width:360px) {
      .content { padding:12px; }
      .sticky { padding-left:12px; padding-right:12px; }
      .category { font-size:10px; }
      .sum-card { padding:10px; }
    }
  </style>
</head>
<body>
  <header class="sticky">
    <div class="top-inner">
      <div class="app-title">
        <h1>🛒 Grocery Tracker</h1>
        <span>Your shopping companion</span>
      </div>
      <div class="budget-row">
        <label class="budget-label" for="budget">MY BUDGET</label>
        <div class="budget-input-wrap">
          <span class="currency">₱</span>
          <input id="budget" type="number" inputmode="decimal" min="0" step="0.01" placeholder="Set your budget" aria-label="Grocery budget">
        </div>
      </div>
      <div class="summary">
        <div class="sum-card total">
          <div class="sum-label">Cart total</div>
          <div class="sum-value" id="total">₱0.00</div>
        </div>
        <div class="sum-card remaining" id="remaining-card">
          <div class="sum-label" id="remaining-label">Remaining budget</div>
          <div class="sum-value" id="remaining">₱0.00</div>
        </div>
      </div>
    </div>
  </header>

  <main class="content">
    <section class="panel">
      <div class="section-heading">
        <h2>Add an item</h2>
        <small>No item name needed</small>
      </div>
      <div class="amount-wrap">
        <span class="currency">₱</span>
        <input id="amount" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0.00" aria-label="Item amount">
      </div>
      <p class="category-label">Choose a category</p>
      <div class="categories" role="group" aria-label="Item category">
        <button class="category selected" type="button" data-category="Food"><span class="emoji">🥬</span>Food</button>
        <button class="category" type="button" data-category="Condiments"><span class="emoji">🧂</span>Condiments</button>
        <button class="category" type="button" data-category="Toiletries"><span class="emoji">🧴</span>Toiletries</button>
        <button class="category" type="button" data-category="Others"><span class="emoji">🛍️</span>Others</button>
      </div>
      <button class="add-btn" id="add-btn" type="button">＋ Add to cart</button>
      <div class="notice" id="notice" role="status" aria-live="polite"></div>
    </section>

    <section class="panel list-panel">
      <div class="section-heading list-heading">
        <h2>Items in my cart</h2>
        <span class="count" id="count">0 items</span>
      </div>
      <ul id="items"></ul>
      <div class="footer-actions">
        <span class="hint">Your cart is saved on this device.</span>
        <button class="clear-btn" id="clear-btn" type="button">Clear all</button>
      </div>
    </section>
  </main>

  <script>
    (() => {
      const STORAGE_KEY = 'groceryBudgetTracker_v1';
      const categoryIcons = { Food: '🥬', Condiments: '🧂', Toiletries: '🧴', Others: '🛍️' };
      const budgetInput = document.getElementById('budget');
      const amountInput = document.getElementById('amount');
      const itemsEl = document.getElementById('items');
      const noticeEl = document.getElementById('notice');
      let selectedCategory = 'Food';
      let items = [];
      let budget = '';

      const money = value => '₱' + Number(value || 0).toLocaleString('en-PH', {
        minimumFractionDigits: 2, maximumFractionDigits: 2
      });

      function load() {
        try {
          const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || '{}');
          items = Array.isArray(saved.items) ? saved.items : [];
          budget = saved.budget ?? '';
        } catch (_) { items = []; budget = ''; }
        budgetInput.value = budget;
        render();
      }

      function save() {
        try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ budget, items })); }
        catch (_) { noticeEl.textContent = 'Could not save on this browser. Check storage settings.'; }
      }

      function render() {
        const total = items.reduce((sum, item) => sum + Number(item.amount), 0);
        const remaining = Number(budget || 0) - total;
        document.getElementById('total').textContent = money(total);
        document.getElementById('remaining').textContent = money(Math.abs(remaining));
        document.getElementById('remaining-label').textContent = remaining < 0 ? 'Over budget by' : 'Remaining budget';
        document.getElementById('remaining-card').classList.toggle('over', remaining < 0);
        document.getElementById('count').textContent = `${items.length} ${items.length === 1 ? 'item' : 'items'}`;

        itemsEl.innerHTML = '';
        if (!items.length) {
          const empty = document.createElement('li');
          empty.className = 'empty';
          empty.innerHTML = '<div class="basket">🧺</div>Your cart is empty.<br>Add an amount above to get started.';
          itemsEl.appendChild(empty);
        } else {
          items.forEach((item, index) => {
            const li = document.createElement('li');
            li.className = 'item';
            const icon = document.createElement('div');
            icon.className = 'item-icon';
            icon.textContent = categoryIcons[item.category] || '🛍️';
            const info = document.createElement('div');
            info.className = 'item-info';
            const category = document.createElement('div');
            category.className = 'item-category';
            category.textContent = item.category;
            const number = document.createElement('div');
            number.className = 'item-number';
            number.textContent = `Item ${index + 1}`;
            info.append(category, number);
            const price = document.createElement('div');
            price.className = 'item-price';
            price.textContent = money(item.amount);
            const del = document.createElement('button');
            del.className = 'delete-btn';
            del.type = 'button';
            del.textContent = '×';
            del.setAttribute('aria-label', `Delete ${item.category} item ${index + 1}`);
            del.addEventListener('click', () => {
              items.splice(index, 1);
              save(); render();
              noticeEl.textContent = 'Item removed from your cart.';
            });
            li.append(icon, info, price, del);
            itemsEl.appendChild(li);
          });
        }
      }

      document.querySelectorAll('.category').forEach(button => {
        button.addEventListener('click', () => {
          selectedCategory = button.dataset.category;
          document.querySelectorAll('.category').forEach(b => b.classList.toggle('selected', b === button));
        });
      });

      budgetInput.addEventListener('input', () => {
        budget = budgetInput.value;
        save(); render();
      });

      function addItem() {
        const amount = Number(amountInput.value);
        if (!amountInput.value || !Number.isFinite(amount) || amount <= 0) {
          noticeEl.textContent = 'Please enter an amount greater than zero.';
          amountInput.focus();
          return;
        }
        items.push({ amount: Math.round(amount * 100) / 100, category: selectedCategory });
        amountInput.value = '';
        noticeEl.textContent = 'Added to your cart!';
        save(); render();
        amountInput.focus();
      }

      document.getElementById('add-btn').addEventListener('click', addItem);
      amountInput.addEventListener('keydown', event => {
        if (event.key === 'Enter') addItem();
      });

      document.getElementById('clear-btn').addEventListener('click', () => {
        if (!items.length) return;
        if (confirm('Clear all items from your cart?')) {
          items = [];
          save(); render();
          noticeEl.textContent = 'Your cart has been cleared.';
        }
      });

      load();
    })();
  </script>
</body>
</html>
